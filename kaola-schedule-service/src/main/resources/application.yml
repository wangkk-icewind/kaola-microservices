server:
  port: 8091

spring:
  application:
    name: kaola-schedule-service

  config:
    import: optional:nacos:localhost:8848

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
      config:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kaola_massage?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: kaola123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

mybatis-plus:
  type-aliases-package: com.kaola.schedule.model.entity
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  enable: true
  openapi:
    title: 考拉推拿 - Schedule服务 API
    description: 排班管理接口文档
    version: 1.0.0
    contact:
      name: Kaola Team
      email: dev@kaola.com

logging:
  level:
    com.kaola.schedule: DEBUG
    com.kaola.schedule.mapper: DEBUG
