server:
  port: 8087

spring:
  config:
    import: optional:nacos:localhost:8848

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kaola_massage?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: kaola123456

  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

# 微信支付配置（可在后台 [系统配置→支付设置] 动态覆盖）
payment:
  wechat:
    app-id: ${WECHAT_PAY_APP_ID:}
    mch-id: ${WECHAT_PAY_MCH_ID:}
    mch-serial-no: ${WECHAT_PAY_MCH_SERIAL_NO:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    # 私钥二选一：内容优先于路径
    private-key: ${WECHAT_PAY_PRIVATE_KEY:}
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:https://kaolalaile.com/api/payment/wechat/notify}
    # 微信支付公钥（替代平台证书，从商户平台-API安全-管理公钥获取）
    public-key: ${WECHAT_PAY_PUBLIC_KEY:}
    public-key-id: ${WECHAT_PAY_PUBLIC_KEY_ID:}

# Feign 服务地址（开发环境直连，生产通过 Nacos）
feign:
  admin-service:
    url: ${ADMIN_SERVICE_URL:http://localhost:8095}
  order-service:
    url: ${ORDER_SERVICE_URL:http://localhost:8086}
