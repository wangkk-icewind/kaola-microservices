server:
  port: 8095

spring:
  application:
    name: kaola-admin-service

  config:
    import: optional:nacos:localhost:8848

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
      config:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kaola_massage?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: kaola123456
  redis:
    host: localhost
    port: 6379
    database: 0

mybatis-plus:
  type-aliases-package: com.kaola.admin.entity
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  enable: true
  openapi:
    title: 考拉推拿 - Admin服务 API
    description: 管理服务 - 管理后台和数据分析接口文档
    version: 1.0.0
    contact:
      name: Kaola Team
      email: dev@kaola.com

logging:
  level:
    com.kaola.admin: DEBUG
    com.kaola.admin.mapper: DEBUG
