server:
  port: 8094

spring:
  application:
    name: kaola-notification-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kaola_massage?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: kaola123456
  redis:
    host: localhost
    port: 6379
    database: 0

mybatis-plus:
  type-aliases-package: com.kaola.notification.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  enable: true
  openapi:
    title: 考拉推拿 - Notification服务 API
    description: 通知服务 - 短信和推送通知接口文档
    version: 1.0.0
    contact:
      name: Kaola Team
      email: dev@kaola.com

# 短信服务配置
sms:
  verify-code:
    expire-minutes: 5
    length: 6

# 阿里云短信配置
aliyun:
  sms:
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:your-access-key-id}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:your-access-key-secret}
    sign-name: 考拉预约
    template-code: SMS_123456789
    endpoint: dysmsapi.aliyuncs.com
    region-id: cn-hangzhou

logging:
  level:
    com.kaola.notification: DEBUG
    com.kaola.notification.mapper: DEBUG
