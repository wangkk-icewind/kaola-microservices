server:
  port: 8093

spring:
  application:
    name: kaola-file-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kaola_massage?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: kaola123456
  redis:
    host: localhost
    port: 6379
    database: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis-plus:
  type-aliases-package: com.kaola.file.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  enable: true
  openapi:
    title: 考拉推拿 - File服务 API
    description: 文件服务 - 文件上传和OSS集成接口文档
    version: 1.0.0
    contact:
      name: Kaola Team
      email: dev@kaola.com

# 阿里云OSS配置
aliyun:
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:kaola}
    url-prefix: ${ALIYUN_OSS_URL_PREFIX:https://kaola.oss-cn-hangzhou.aliyuncs.com}

logging:
  level:
    com.kaola.file: DEBUG
    com.kaola.file.mapper: DEBUG
