server:
  port: 8081

spring:
  application:
    name: kaola-auth-service

  config:
    import: optional:nacos:localhost:8848

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
      config:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yml

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kaola_massage?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: kaola123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5000ms

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
    banner: false
  type-aliases-package: com.kaola.auth.model.entity

# JWT 配置
jwt:
  secret: kaola-massage-secret-key-2024-for-admin-authentication
  expiration: 86400000  # 24小时

# Swagger/Knife4j 配置
knife4j:
  enable: true
  openapi:
    title: 考拉推拿 - 认证授权服务 API
    description: 管理员登录、JWT认证、角色权限管理接口文档
    version: 1.0.0
    contact:
      name: Kaola Team
      email: support@kaola.com
    license: Apache 2.0
    license-url: https://www.apache.org/licenses/LICENSE-2.0.html

# 日志配置
logging:
  level:
    com.kaola.auth: DEBUG
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

# Actuator 健康检查配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
