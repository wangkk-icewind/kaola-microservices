server:
  port: 8090

jwt:
  secret: kaola-massage-secret-key-2024-for-admin-authentication

spring:
  application:
    name: kaola-gateway

  config:
    import: optional:nacos:localhost:8848

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
        register-enabled: true
        watch:
          enabled: true
      config:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yml

    loadbalancer:
      nacos:
        enabled: true
      cache:
        enabled: false

    gateway:
      # 路由配置
      routes:
        # Auth Service 路由
        - id: kaola-auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/admin/auth/**
          filters:
            - StripPrefix=1

        # User Service 路由 - Admin User
        - id: kaola-user-service-admin-user
          uri: http://localhost:8082
          predicates:
            - Path=/api/admin/user/**
          filters:
            - StripPrefix=1

        # User Service 路由 - Admin Role
        - id: kaola-user-service-admin-role
          uri: http://localhost:8082
          predicates:
            - Path=/api/admin/role/**
          filters:
            - StripPrefix=1

        # User Service 路由 - Public
        - id: kaola-user-service-public
          uri: http://localhost:8082
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1

        # Store Service 路由 - Admin City
        - id: kaola-store-service-admin-city
          uri: http://localhost:8083
          predicates:
            - Path=/api/admin/city/**
          filters:
            - StripPrefix=1

        # Store Service 路由 - Admin
        - id: kaola-store-service-admin
          uri: http://localhost:8083
          predicates:
            - Path=/api/admin/store/**
          filters:
            - StripPrefix=1

        # Marketing Service 路由 - Store Promotions (must come before general store route)
        - id: kaola-marketing-service-store-promotions
          uri: http://localhost:8092
          predicates:
            - Path=/api/store/*/promotions
          filters:
            - StripPrefix=1

        # Store Service 路由 - Public
        - id: kaola-store-service-public
          uri: http://localhost:8083
          predicates:
            - Path=/api/store/**
          filters:
            - StripPrefix=1

        # City Service 路由 - Public (城市列表和搜索)
        - id: kaola-city-service-public
          uri: http://localhost:8083
          predicates:
            - Path=/api/city/**
          filters:
            - StripPrefix=1

        # Masseur Service 路由 - Admin Masseur Earnings (必须在通用admin/masseur路由之前)
        - id: kaola-masseur-service-admin-earnings
          uri: http://localhost:8084
          predicates:
            - Path=/api/admin/masseur/earnings/**
          filters:
            - StripPrefix=1

        # Masseur Service 路由 - Admin Masseur Projects (必须在通用admin/masseur路由之前)
        - id: kaola-masseur-service-admin-projects
          uri: http://localhost:8084
          predicates:
            - Path=/api/admin/masseur/*/projects
          filters:
            - StripPrefix=1

        # Masseur Service 路由 - Admin Masseur
        - id: kaola-masseur-service-admin-masseur
          uri: http://localhost:8084
          predicates:
            - Path=/api/admin/masseur/**
          filters:
            - StripPrefix=1

        # Product Service 路由 - Admin Product 基础路径 (POST /api/admin/product)
        - id: kaola-product-service-admin-product-base
          uri: http://localhost:8085
          predicates:
            - Path=/api/admin/product
          filters:
            - RewritePath=/api/admin/product, /product

        # Product Service 路由 - Admin Product 子路径 (商品管理)
        - id: kaola-product-service-admin-product
          uri: http://localhost:8085
          predicates:
            - Path=/api/admin/product/**
          filters:
            - RewritePath=/api/admin/product/(?<seg>.*), /product/${seg}

        # Order Service 路由 - Masseur Orders (必须在通用masseur路由之前)
        - id: kaola-order-service-masseur-orders
          uri: http://localhost:8086
          predicates:
            - Path=/api/masseur/orders,/api/masseur/orders/**
          filters:
            - RewritePath=/api/masseur/orders(?<seg>.*), /masseur/orders${seg}

        # Schedule Service 路由 - Masseur Schedules (必须在通用masseur路由之前)
        - id: kaola-schedule-service-masseur-schedules
          uri: http://localhost:8091
          predicates:
            - Path=/api/masseur/schedules,/api/masseur/schedules/**
          filters:
            - RewritePath=/api/masseur/schedules(?<seg>.*), /masseur/schedules${seg}

        # Order Service 路由 - Masseur Availability（忙碌状态查询，必须在通用masseur路由之前）
        - id: kaola-order-service-masseur-availability
          uri: http://localhost:8086
          predicates:
            - Path=/api/masseur/availability
          filters:
            - RewritePath=/api/masseur/availability, /masseur/availability

        # Masseur Service 路由 - Public
        - id: kaola-masseur-service-public
          uri: http://localhost:8084
          predicates:
            - Path=/api/masseur/**
          filters:
            - StripPrefix=1

        # Product Service 路由 - Admin (Project endpoints)
        - id: kaola-product-service-admin-project
          uri: http://localhost:8085
          predicates:
            - Path=/api/admin/project/**
          filters:
            - StripPrefix=1

        # Product Service 路由 - Public
        - id: kaola-product-service-public
          uri: http://localhost:8085
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=1

        # Product Service 路由 - Project (项目相关接口)
        - id: kaola-product-service-project
          uri: http://localhost:8085
          predicates:
            - Path=/api/project/**
          filters:
            - StripPrefix=1

        # Product Service 路由 - Category (项目分类管理)
        - id: kaola-product-service-category
          uri: http://localhost:8085
          predicates:
            - Path=/api/category/**
          filters:
            - StripPrefix=1

        # Product Service 路由 - Admin Pricing (定价配置管理)
        - id: kaola-product-service-admin-pricing
          uri: http://localhost:8085
          predicates:
            - Path=/api/admin/pricing/**
          filters:
            - StripPrefix=1

        # Product Service 路由 - Admin Price Calculation (价格计算)
        - id: kaola-product-service-admin-price
          uri: http://localhost:8085
          predicates:
            - Path=/api/admin/price/**
          filters:
            - StripPrefix=1

        # Order Service 路由 - Admin
        - id: kaola-order-service-admin
          uri: http://localhost:8086
          predicates:
            - Path=/api/admin/order/**
          filters:
            - StripPrefix=1

        # Order Service 路由 - Public
        - id: kaola-order-service-public
          uri: http://localhost:8086
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1

        # Schedule Service 路由 - Admin Schedule
        - id: kaola-schedule-service-admin-schedule
          uri: http://localhost:8091
          predicates:
            - Path=/api/admin/schedule/**
          filters:
            - StripPrefix=1

        # Schedule Service 路由 - Admin Leave
        - id: kaola-schedule-service-admin-leave
          uri: http://localhost:8091
          predicates:
            - Path=/api/admin/leave/**
          filters:
            - StripPrefix=1

        # Schedule Service 路由 - Public Schedule
        - id: kaola-schedule-service-public
          uri: http://localhost:8091
          predicates:
            - Path=/api/schedule/**
          filters:
            - StripPrefix=1

        # Schedule Service 路由 - Public Leave
        - id: kaola-schedule-service-leave
          uri: http://localhost:8091
          predicates:
            - Path=/api/leave/**
          filters:
            - StripPrefix=1

        # Marketing Service 路由 - Promotion
        - id: kaola-marketing-service-promotion
          uri: http://localhost:8092
          predicates:
            - Path=/api/promotion/**
          filters:
            - StripPrefix=1

        # Marketing Service 路由 - Admin Promotion
        - id: kaola-marketing-service-admin-promotion
          uri: http://localhost:8092
          predicates:
            - Path=/api/admin/promotion/**
          filters:
            - StripPrefix=1

        # Marketing Service 路由 - Admin Coupon
        - id: kaola-marketing-service-admin-coupon
          uri: http://localhost:8092
          predicates:
            - Path=/api/admin/coupon/**
          filters:
            - StripPrefix=1

        # Marketing Service 路由 - Coupon
        - id: kaola-marketing-service-coupon
          uri: http://localhost:8092
          predicates:
            - Path=/api/coupon/**
          filters:
            - StripPrefix=1

        # Marketing Service 路由 - Price Config (定价配置)
        - id: kaola-marketing-service-price
          uri: http://localhost:8092
          predicates:
            - Path=/api/price/**
          filters:
            - StripPrefix=1

        # Review Service 路由
        - id: kaola-review-service
          uri: http://localhost:8093
          predicates:
            - Path=/api/review/**
          filters:
            - StripPrefix=1

        # Complaint Service 路由
        - id: kaola-complaint-service
          uri: http://localhost:8094
          predicates:
            - Path=/api/complaint/**
          filters:
            - StripPrefix=1

        # Finance Service 路由 - Withdrawals (实际在 earning-service 中)
        - id: kaola-earning-service-finance-withdrawals
          uri: http://localhost:8096
          predicates:
            - Path=/api/finance/withdrawals,/api/finance/approve,/api/finance/approveWithdrawal,/api/finance/complete/**,/api/finance/detail/**
          filters:
            - StripPrefix=1

        # Finance Service 路由 - Earnings (实际在 masseur-service 中)
        - id: kaola-masseur-service-finance
          uri: http://localhost:8084
          predicates:
            - Path=/api/finance/earnings
          filters:
            - StripPrefix=1

        # Admin Service 路由 - Dashboard & Settings
        - id: kaola-admin-service-dashboard
          uri: http://localhost:8095
          predicates:
            - Path=/api/admin/dashboard/**
          filters:
            - StripPrefix=1

        # Admin Service 路由 - Settings
        - id: kaola-admin-service-settings
          uri: http://localhost:8095
          predicates:
            - Path=/api/admin/settings/**
          filters:
            - StripPrefix=1

      # 全局CORS配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true

      # 默认过滤器
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

# 日志配置
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.kaola.gateway: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

# Actuator 健康检查配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
