# Bootstrap 配置 - 优先于 application.yml 加载
# 用于配置 Nacos 配置中心

spring:
  application:
    name: kaola-gateway

  cloud:
    nacos:
      # Nacos 服务发现配置
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP

      # Nacos 配置中心配置
      config:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yml
        # 共享配置
        shared-configs:
          - data-id: kaola-common.yml
            group: DEFAULT_GROUP
            refresh: true
